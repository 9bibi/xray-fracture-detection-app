services:
  - type: web
    name: xray-fracture-detection-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash scripts/fetch_model.sh
    startCommand: bash scripts/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_URL
        sync: false
